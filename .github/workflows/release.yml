name: Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 1: GitHub Release
  #   - enableAutoUpdater = true (default, no patch needed)
  #   - Packages VSIX and uploads to GitHub Releases
  # ──────────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from file
        id: get_version
        run: |
          VERSION=$(cat version | tr -d '\r\n[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if this version is already released
        id: check_release
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ env.VERSION }}")
          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check_release.outputs.status != '200'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_release.outputs.status != '200'
        run: npm install

      - name: Compile extension
        if: steps.check_release.outputs.status != '200'
        run: npm run compile

      - name: Package VSIX (enableAutoUpdater = true)
        if: steps.check_release.outputs.status != '200'
        run: npx vsce package -o "commity-${{ env.VERSION }}.vsix"

      - name: Create GitHub Release
        if: steps.check_release.outputs.status != '200'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Commity v${{ env.VERSION }}"
          draft: false
          prerelease: false
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.

            **Installation:**
            Download `commity-${{ env.VERSION }}.vsix` below and install via:
            Extensions sidebar -> ... -> Install from VSIX
          files: |
            commity-${{ env.VERSION }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # Job 2: OpenVSX Registry
  #   - Patches enableAutoUpdater default to false before publish
  #     (OpenVSX handles extension updates — self-updater not needed)
  #   - Requires OVSX_PAT secret (token from open-vsx.org)
  # ──────────────────────────────────────────────────────────────────
  openvsx:
    name: OpenVSX Registry
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Patch — disable auto-updater for OpenVSX build
        run: node scripts/pre-publish.js

      - name: Compile extension
        run: npm run compile

      - name: Publish to OpenVSX
        run: npx ovsx publish -p ${{ secrets.OVSX_PAT }}
